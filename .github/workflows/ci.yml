name: CI

# Both target platforms run the whole suite. Ubuntu is a first-class target
# but is easy to break from a Windows dev machine — path handling, case
# sensitivity, Qt platform plugins — so it must be exercised on every push.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen # the UI tests need no display
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      # PySide6 links these even for the offscreen platform plugin; the
      # GitHub runner image does not ship them.
      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libdbus-1-3

      - name: Install
        run: pip install -e .[dev]

      - name: Format
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q
